[package]
name = "agent_fuzzer"
version = "0.0.1"
authors = ["AnnabellaM"]
edition = "2021"

[features]
no_link_main = ["libafl_targets/libfuzzer_no_link_main"]

[dependencies]
libafl = { path = "../LibAFL/libafl/" }
libafl_bolts = { path = "../LibAFL/libafl_bolts/" }
libafl_targets = { path = "../LibAFL/libafl_targets/", features = ["sancov_pcguard_hitcounts", "sancov_cmplog", "libfuzzer"] }
libafl_cc = { path = "../LibAFL/libafl_cc/" }
clap = { version = "4.0", features = ["default"] }
nix = { version = "0.29", features = ["fs"] }
mimalloc = { version = "*", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["staticlib"]
